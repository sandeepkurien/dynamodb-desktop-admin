[package]
name = "dynamodb-admin"
version = "0.1.0"
description = "A desktop admin for Amazon DynamoDB"
authors = ["you"]
edition = "2021"

[lib]
name = "dynamodb_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-credential-types = "1"
aws-types = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
dirs = "6"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
